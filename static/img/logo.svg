<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="screenGrad" x1="4" y1="8" x2="44" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="8" y1="12" x2="40" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cinema Screen Outline (Curved DCI Aspect) -->
  <path d="M4 10C16 12 32 12 44 10V32C32 34 16 34 4 32V10Z" 
        stroke="url(#screenGrad)" stroke-width="2.5" stroke-linejoin="round" fill="#0b1329" fill-opacity="0.85" filter="url(#glow)"/>

  <!-- Cinema Projector Beam Lines -->
  <path d="M4 10L24 22L44 10" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.6"/>
  <path d="M4 32L24 22L44 32" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.6"/>

  <!-- AI Neural Network Nodes on the Screen -->
  <line x1="14" y1="21" x2="24" y2="16" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <line x1="24" y1="16" x2="34" y2="21" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <line x1="14" y1="21" x2="24" y2="26" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <line x1="24" y1="26" x2="34" y2="21" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <line x1="24" y1="16" x2="24" y2="26" stroke="#00f0ff" stroke-width="1.2"/>

  <!-- Nodes (Glowing Gold & Cyan) -->
  <circle cx="14" cy="21" r="2.8" fill="#fbbf24" stroke="#ffffff" stroke-width="1"/>
  <circle cx="24" cy="16" r="3.2" fill="#00f0ff" stroke="#ffffff" stroke-width="1" filter="url(#glow)"/>
  <circle cx="24" cy="26" r="3.2" fill="#3b82f6" stroke="#ffffff" stroke-width="1"/>
  <circle cx="34" cy="21" r="2.8" fill="#fbbf24" stroke="#ffffff" stroke-width="1"/>

  <!-- Screen Stand Base -->
  <path d="M18 40H30" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M24 33V40" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>
